services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-optimind}
      POSTGRES_USER: ${POSTGRES_USER:-optimind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optimind}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optimind} -d ${POSTGRES_DB:-optimind}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

